apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: angular
  template:
    metadata:
      labels:
        app: angular
    spec:
      containers:
      - name: angular
        image: 081139831993.dkr.ecr.us-east-1.amazonaws.com/eks-angular-repo:latest
        ports:
        - containerPort: 80
