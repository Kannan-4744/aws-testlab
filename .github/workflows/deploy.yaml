name: Application Deployment

on:
 workflow_dispatch:
 push:
  paths:
  - 'terraform/**'

env:
 AWS_REGION: eu-west-1
 ECR_URL: 081139831993.dkr.ecr.eu-west-1.amazonaws.com/angular-devops-repo
 CLUSTER_NAME: angular-devops-cluster
 SERVICE_NAME: angular-devops-service

jobs:
 terraform:
   runs-on: ubuntu-latest
   environment: dev


   steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_URL

    - name: Build Docker Image
      run: |
        docker build -t angular-devops-app ./app

    - name: Tag Docker Image
      run: |
        docker tag angular-devops-app:latest $ECR_URL:latest

    - name: Push Docker Image
      run: |
        docker push $ECR_URL:latest

    - name: Deploy to ECS
      run: |
        aws ecs update-service \
        --cluster $CLUSTER_NAME \
        --service $SERVICE_NAME \
        --force-new-deployment
