name: Build, Push & Deploy to EKS

on:
  push:
    branches:
      - aks

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: angular-frontend
  EKS_CLUSTER_NAME: angular-eks
  HELM_RELEASE_NAME: angular-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    # 1️⃣ Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3️⃣ Login to ECR
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4️⃣ Set Image Tag (unique per commit)
    - name: Set Image Tag
      run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

    # 5️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG ./angular-project

    # 6️⃣ Tag Docker Image
    - name: Tag Image
      run: |
        docker tag $ECR_REPOSITORY:$IMAGE_TAG \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

    # 7️⃣ Push Image to ECR
    - name: Push Image
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

    # 8️⃣ Update kubeconfig
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

    # 9️⃣ Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v4

    # 🔟 Deploy using Helm (IMPORTANT FIXES APPLIED)
    - name: Deploy to EKS using Helm
      run: |
        helm upgrade --install $HELM_RELEASE_NAME ./angular-chart \
          --set image.repository=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY \
          --set image.tag=$IMAGE_TAG \
          --force

    # 1️⃣1️⃣ Force rollout restart (ENSURE NEW IMAGE IS USED)
    - name: Restart Deployment
      run: |
        kubectl rollout restart deployment angular-app-angular-chart

    # 1️⃣2️⃣ Verify rollout
    - name: Verify Deployment
      run: |
        kubectl rollout status deployment angular-app-angular-chart